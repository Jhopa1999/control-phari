# Nginx como unico punto publico del portal.
#   /       -> Next.js (web:3000)
#   /api/   -> NestJS  (api:3001), quitando el prefijo /api
#
# Se monta en /etc/nginx/conf.d/default.conf (dentro del bloque http de la
# imagen oficial de nginx).
#
# HTTPS: este archivo sirve HTTP (puerto 80) para empezar. Para produccion real,
# terminar TLS aqui. Ver docs/deployment.md (seccion HTTPS / Let's Encrypt).

# Cabecera Connection para upgrades (websockets / HMR).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream web_upstream {
  server web:3000;
}

upstream api_upstream {
  server api:3001;
}

server {
  listen 80;
  server_name _;

  # Tamano maximo de cuerpo de peticion (ajustar segun necesidad).
  client_max_body_size 10m;

  # API: /api/health -> api:3001/health, /api/catalog-items -> /catalog-items.
  # La barra final en proxy_pass hace que Nginx elimine el prefijo /api/.
  location /api/ {
    proxy_pass http://api_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend Next.js (todo lo demas).
  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Soporte de upgrade (HMR en dev / websockets si el runtime lo usa).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# -----------------------------------------------------------------------------
