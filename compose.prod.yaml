# Compose de PRODUCCION (un solo servidor).
#   nginx (unico punto publico) -> web (Next.js) + api (NestJS) -> postgres
#
# Variables desde un archivo .env.production (ver .env.production.example).
# Uso:
#   docker compose -f compose.prod.yaml --env-file .env.production build
#   docker compose -f compose.prod.yaml --env-file .env.production up -d
# Migraciones (paso explicito, NO en el arranque):
#   docker compose -f compose.prod.yaml --env-file .env.production \
#     run --rm api npm run prisma:migrate:deploy --workspace apps/api

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # NO se publica 5432 al host: solo accesible en la red interna de compose.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # El backend se conecta por el nombre del servicio, no por localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3001"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Autenticacion: en produccion AUTH_MODE=jwt y el secreto viene del
      # entorno (.env.production). Sin estas variables el backend no puede
      # firmar los JWT de /auth/login.
      AUTH_MODE: ${AUTH_MODE:-jwt}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Clave de cifrado de secretos de configuracion (password SMTP en BD).
      # 32 bytes base64 (openssl rand -base64 32). Obligatoria SOLO al leer/
      # escribir el password SMTP; el API arranca sin ella.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # Correo (SMTP): OPCIONAL. Se configura en runtime desde administracion
      # (fuente BD > entorno). Si se definen aqui, sirven de fallback de entorno.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      # URL base del frontend para enlaces de reset/invitacion (unica fuente).
      APP_WEB_URL: ${APP_WEB_URL:-}
      # Evidencias de tareas: bucket maestro S3. Las credenciales AWS son
      # opcionales: en EC2 se usa el rol de la instancia (dejarlas vacias).
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-}
      PORTFOLIO_DUE_SOON_DAYS: ${PORTFOLIO_DUE_SOON_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    # No se publica al host: solo Nginx habla con la API.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Produccion: el navegador consume la API via mismo dominio (/api).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        # Modo de autenticacion del frontend: debe coincidir con AUTH_MODE del
        # backend. En produccion "jwt" (login + Authorization: Bearer).
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-jwt}
    restart: unless-stopped
    depends_on:
      - api
    # No se publica al host: solo Nginx habla con la web.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/catalogs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    environment:
      # Transporte por red. La identidad llega POR PETICION (Authorization:
      # Bearer); no hay token a nivel de proceso. No se hornean secretos.
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3002"
      # El MCP habla con el API por el nombre del servicio en la red interna de
      # compose (NO /api, NO localhost).
      MCP_API_BASE_URL: http://api:3001
      # En produccion la identidad es JWT (Bearer por persona).
      MCP_AUTH_MODE: jwt
    depends_on:
      - api
    # No se publica puerto al host: solo Nginx habla con el MCP (via /mcp).
    # Healthcheck: comprueba que el listener HTTP acepta conexiones TCP. No hace
    # una peticion MCP (requeriria un POST valido con sesion y Bearer).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(3002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - mcp
    ports:
      # Unico punto publico.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data_prod:
